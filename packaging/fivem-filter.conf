# /etc/fivem-filter.conf
#
# Read by `fivemctl load --config` and `fivemctl reload`. Every setting has
# the same name as its --flag. Anything left out keeps its default; run
# `fivemctl help` for the full list.

# Interface the game traffic arrives on.
interface = eth0

# The address players connect to, *as the NIC sees it*. On most clouds
# (AWS, GCP, Azure, OVH vRack...) that's the private address on the
# interface, not the public one - the public IP is NAT'd before it reaches
# you. `ip -br addr show eth0` tells you which.
ip = 203.0.113.10
#ip6 = 2001:db8::10

# Game port (UDP + TCP). A range works too: port = 30120-30122
port = 30120

# txAdmin, or anything else that should get the same treatment.
#aux-port = 40120

# Leave this on through a busy evening, watch `fivemctl stats`, then
# comment it out and `systemctl reload fivem-filter`. Skipping this step is
# how people firewall their own player base.
on = dry-run

# Per-source limits. Defaults shown.
#pps = 200
#burst = 60
#syn-rate = 5
#syn-burst = 16
#oob-rate = 1
#oob-burst = 3
#conn-per-min = 60

# Box-wide ceilings. These are the only limits that mean anything against
# spoofed sources. Keep them well above your real peak.
#global-syn-pps = 20000
#global-oob-pps = 2000

# Accepted UDP payload on game ports.
#udp-min = 1
#udp-max = 1400

# How long pre-existing TCP connections get adopted after a load.
#grace = 30s
