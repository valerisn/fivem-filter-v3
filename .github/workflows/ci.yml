name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# every small commit pushes, so don't let a queue of stale runs pile up
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: unit tests
        run: make test-unit

  bpf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev libelf-dev zlib1g-dev \
            linux-tools-common linux-tools-$(uname -r)
      - name: build bpf object
        run: make bpf
      - name: verifier
        run: sudo make verify
