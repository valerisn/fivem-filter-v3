name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# every small commit pushes, so don't let a queue of stale runs pile up
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: unit tests
        run: make test-unit
